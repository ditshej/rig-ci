# rig-ci: job `quality` for Node projects. Called with workflow_call; see README.md.
# With a package.json, it uses the installed Prettier and TypeScript and the
# npm script `test:coverage`. Without one, it runs them through npx and node --test.
name: Node quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version of production, e.g. '22'. Set this or node-version-file.
        type: string
        default: ''
      node-version-file:
        description: File with the Node version, relative to the repository root, e.g. 'game/.nvmrc'. Set this or node-version.
        type: string
        default: ''
      working-directory:
        description: Folder with the package.json, relative to the repository root. All steps run there.
        type: string
        default: '.'
      timeout-minutes:
        description: Time limit of the job. A project that raises it gives the reason in its CLAUDE.md.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check inputs
        working-directory: .
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        run: |
          if [ -n "$NODE_VERSION" ] && [ -n "$NODE_VERSION_FILE" ]; then
            echo "::error::Set either node-version or node-version-file, not both."
            exit 1
          fi
          if [ -z "$NODE_VERSION" ] && [ -z "$NODE_VERSION_FILE" ]; then
            echo "::error::Set node-version or node-version-file."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
      - name: Install npm packages
        if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        run: npm ci
      - name: Prettier
        run: |
          if [ -x node_modules/.bin/prettier ]; then
            node_modules/.bin/prettier --check .
          else
            npx --yes prettier@3 --check .
          fi
      - name: TypeScript
        if: hashFiles(format('{0}/tsconfig.json', inputs.working-directory)) != ''
        run: |
          if [ -x node_modules/.bin/tsc ]; then
            node_modules/.bin/tsc --noEmit
          else
            npx --yes -p typescript tsc --noEmit
          fi
      - name: Tests with coverage
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.['test:coverage'] ? 0 : 1)"; then
            npm run test:coverage
          else
            node --test --experimental-test-coverage --test-coverage-lines=70
          fi