# rig-ci: job `security` for every project. Called with workflow_call; see README.md.
# The audit of runtime dependencies fails the job. The audit of all
# dependencies, dev included, only writes a warning.
name: Security

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for composer audit (used only with a composer.lock).
        type: string
        default: '8.3'
      php-extensions:
        description: PHP extensions for shivammathur/setup-php, e.g. 'curl, dom, gd'.
        type: string
        default: ''
      working-directory:
        description: Folder with the package.json for the npm checks, relative to the repository root. Composer is always checked in the root.
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: CLAUDE.md length (warning only)
        run: |
          # With Laravel Boost the project part lives in .ai/guidelines/project.md.
          if [ -f .ai/guidelines/project.md ]; then
            lines=$(wc -l < .ai/guidelines/project.md)
          elif [ -d .ai/guidelines ]; then
            lines=$(cat .ai/guidelines/*.md 2>/dev/null | wc -l)
          elif [ -f CLAUDE.md ]; then
            lines=$(wc -l < CLAUDE.md)
            # Follow @imports one level deep (files in the repository only).
            for f in $(grep -oE '(^|[[:space:]])@[^[:space:]]+' CLAUDE.md | sed 's/^[[:space:]]*@//' | sort -u); do
              case "$f" in /*|~*|*..*) continue ;; esac
              if [ -f "$f" ]; then
                lines=$((lines + $(wc -l < "$f")))
              fi
            done
          else
            exit 0
          fi
          if [ "$lines" -gt 60 ]; then
            echo "::warning file=CLAUDE.md::The project part of CLAUDE.md has $lines lines (guide: about 60)."
          fi
      - name: Lockfiles
        env:
          NPM_DIR: ${{ inputs.working-directory }}
        run: |
          status=0
          if [ -f composer.json ] && [ ! -f composer.lock ]; then
            echo "::error file=composer.json::composer.json without composer.lock. Commit the lockfile."
            status=1
          fi
          npm_prefix=""
          if [ "${NPM_DIR%/}" != "." ]; then npm_prefix="${NPM_DIR%/}/"; fi
          if [ -f "${npm_prefix}package.json" ] && [ ! -f "${npm_prefix}package-lock.json" ]; then
            echo "::error file=${npm_prefix}package.json::package.json without package-lock.json. Commit the lockfile."
            status=1
          fi
          exit $status
      - uses: shivammathur/setup-php@v2
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none
          tools: composer:v2
      - name: composer audit (runtime)
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        run: composer audit --locked --no-dev
      - name: composer audit (all packages, warning only)
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        run: |
          composer audit --locked || echo "::warning file=composer.lock::composer audit found a vulnerability. Runtime packages fail the step above; dev packages: see rig-enforcement, section 3."
      - name: npm audit (runtime)
        if: (success() || failure()) && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (all dependencies, warning only)
        if: (success() || failure()) && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          NPM_DIR: ${{ inputs.working-directory }}
        run: |
          lockfile=package-lock.json
          if [ "${NPM_DIR%/}" != "." ]; then lockfile="${NPM_DIR%/}/package-lock.json"; fi
          npm audit --audit-level=high || echo "::warning file=$lockfile::npm audit found a high or critical vulnerability. Runtime dependencies fail the step above; dev dependencies: see rig-enforcement, section 3."